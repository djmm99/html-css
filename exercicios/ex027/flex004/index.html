<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: rgb(245, 213, 170);

            display: flex;
            flex-flow:row nowrap;
            justify-content: space-evenly;
        }

        div.item {
            background-color: rgb(156, 156, 255);
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Dicas de atalhos (VS code): 
     
        - Para duplicar uma linha dentro do código (ou uma parte grande selecionada), usem shift+alt+seta
        - Para mover uma linha dentro do código, usem alt+seta
        - Para apagar uma linha de código, usem ctrl+shift+k. -->

    <!--EMMENT .conteiner>div.item{$}*7 -->

    <div class="conteiner">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
    </div> 
</body>
</html>
