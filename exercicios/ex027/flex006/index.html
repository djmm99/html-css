<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <title>Flexible Box</title>
    <style>

        div.conteiner {
            background-color: #f5d5aa;
            border: 1px solid #000000;
            border-radius: 10px;


            display: flex;
            flex-flow:row wrap;
            align-content: space-around;
            height: 600px;
        }

        div.item {
            font-size: 4em;
            background-color: #9c9cff;
            border: 1px solid #000000;
            border-radius: 10px;
            padding: 18px 29px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <!-- Dicas de atalhos (VS code): 
     
        - Para duplicar uma linha dentro do código (ou uma parte grande selecionada), usem shift+alt+seta
        - Para mover uma linha dentro do código, usem alt+seta
        - Para apagar uma linha de código, usem ctrl+shift+k. -->

    <!--EMMENT .conteiner>div.item{$}*7 -->

    <div class="conteiner">
        <div class="item">0</div>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
        <div class="item">9</div>
    </div>
</body>
</html>
