<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <title>Flexible Box</title>
    <style>

        div.conteiner {
            background-color: #f5d5aa;
            border: 1px solid #000000;
            border-radius: 10px;


            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            font-size: 1em;
            background-color: #9c9cff;
            border: 1px solid #000000;
            border-radius: 10px;
            
            flex-basis: 100px;
        }
        
        div#i1 {          
            flex-shrink: 2;
            flex-grow: 0;
        }

        div#i2 {          
            flex-shrink: 1;
            flex-grow: 0;
            
        }

        div#i3 {
            flex-shrink: 4;
            flex-grow: 0;
            
        }


    </style>
</head>
<body>
    <!-- Dicas de atalhos (VS code): 
     
        - Para duplicar uma linha dentro do código (ou uma parte grande selecionada), usem shift+alt+seta
        - Para mover uma linha dentro do código, usem alt+seta
        - Para apagar uma linha de código, usem ctrl+shift+k. -->

    <!--EMMENT .conteiner>div.item{$}*7 -->

    <div class="conteiner">
        <div class="item" id="i1">1</div>
        <div class="item" id="i2">2</div>
        <div class="item" id="i3">3</div>
    </div>
</body>
</html>
